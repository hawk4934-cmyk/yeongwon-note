<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="영원노트">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>영원노트</title>
<style>
:root{
  --bg:#F3F5F8; --side:#E8ECF1; --surface:#FFFFFF; --ink:#1F2633; --muted:#667080; --faint:#98A0AC;
  --line:#DCE1E8; --accent:#2F5D8A; --accent-soft:#E1EAF4; --danger:#C2463A; --hl:#FFF06A; --hl-cur:#FFB547;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171B22; --side:#1C2129; --surface:#20262F; --ink:#E6E9EE; --muted:#9AA3B0; --faint:#69727F;
    --line:#2E3540; --accent:#86AEDB; --accent-soft:#25324A; --danger:#E0786C; --hl:rgba(255,226,60,.38); --hl-cur:rgba(255,150,40,.65);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

.app{display:grid;grid-template-columns:232px 330px minmax(0,1fr);height:100%;max-width:100vw;overflow:hidden}

/* 사이드바 */
.side{background:var(--side);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.brand{padding:20px 20px 12px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.nav{flex:1;overflow-y:auto;padding:4px 10px 10px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:15px}
.nav-item:hover{background:rgba(127,140,160,.12)}
.nav-item.on{background:var(--surface);font-weight:600;box-shadow:0 1px 0 var(--line)}
.nav-item .count{margin-left:auto;color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
.nav-item .ico{width:16px;text-align:center;color:var(--muted);flex:none}
.dot{width:11px;height:11px;border-radius:50%;flex:none;margin:0 2px}
.nav-group{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 6px;color:var(--muted);font-size:13px;font-weight:600}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);font-size:18px;line-height:1;flex:none}
.icon-btn:hover{background:rgba(127,140,160,.15);color:var(--ink)}
.folder-row{display:flex;align-items:center}
.folder-row .nav-item{flex:1;min-width:0}
.folder-row .nav-item span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-row .edit{opacity:0}
.folder-row:hover .edit,.folder-row .nav-item.on + .edit{opacity:1}
@media (hover:none){.folder-row .edit{opacity:1}}
.tog{width:20px;height:24px;flex:none;color:var(--faint);font-size:11px;display:inline-grid;place-items:center;border-radius:4px}
.tog:hover{color:var(--ink);background:rgba(127,140,160,.15)}
.tog-sp{width:20px;flex:none}
.sub-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px 10px 16px;border-radius:10px;font-weight:600;font-size:calc(var(--ed-size,17px) * .88);text-align:left}
.sub-item:hover{background:rgba(127,140,160,.10)}
.sub-item .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-item .count{margin-left:auto;color:var(--faint);font-weight:400;font-size:13px;flex:none}
.sub-item .arrow{color:var(--faint);flex:none}
.sub-sep{height:1px;background:var(--line);margin:6px 10px 8px}
dialog select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:15px}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0 26px}
.side-foot{border-top:1px solid var(--line);padding:10px 14px 14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.ok i{background:#4E9C63}.sync.busy i{background:#D99A2B}.sync.err i{background:var(--danger)}
.foot-links{display:flex;flex-wrap:wrap;gap:4px 12px}
.link{color:var(--accent);font-size:13px}

/* 목록 */
.list{background:var(--bg);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.list-head{padding:16px 16px 10px;display:flex;align-items:center;gap:8px}
.list-title{font-size:20px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btn{display:none}
.search{margin:0 16px 10px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.search input:focus{outline:none;border-color:var(--accent)}
.search::before{content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;border:2px solid var(--faint);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:23px;top:58%;width:6px;height:2px;background:var(--faint);transform:rotate(45deg)}
.notes{flex:1;overflow-y:auto;padding:0 10px 90px}
.note-item{display:block;width:100%;text-align:left;padding:12px 12px 12px 16px;border-radius:10px;position:relative;margin-bottom:2px}
.note-item::before{content:"";position:absolute;left:5px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--tab,transparent)}
.note-item:hover{background:rgba(127,140,160,.10)}
.note-item.on{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.note-title{font-weight:600;font-size:calc(var(--ed-size,17px) * .88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-meta{display:flex;gap:8px;font-size:calc(var(--ed-size,17px) * .76);color:var(--muted);margin-top:2px;min-width:0}
.note-meta time{flex:none;font-variant-numeric:tabular-nums}
.note-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.list,.editor,.notes,.note-item{min-width:0}
.notes{overflow-x:hidden}
.pin{color:var(--accent);font-size:12px;margin-right:4px}
.empty{padding:48px 24px;text-align:center;color:var(--muted);font-size:14px}
.fab{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px rgba(30,60,100,.28)}
.list{position:relative}
.trash-bar{margin:0 16px 10px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

/* 편집기 */
.editor{background:var(--surface);display:flex;flex-direction:column;min-height:0;position:relative}
.fmt-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.fmt-group{display:flex;align-items:center;gap:5px}
.fmt-label{font-size:12px;color:var(--muted);margin-right:2px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none}
.sw.hl-sw{border-radius:6px}
.fmt-btn{height:30px;min-width:32px;padding:0 8px;border-radius:8px;background:var(--bg);font-size:14px;font-weight:600}
.fmt-size span{min-width:40px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#fmtBtn{font-weight:700;font-size:16px}
#fmtBtn.on{background:var(--accent-soft)}
.ed-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ed-bar .back{display:none}
.ed-bar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:14px;max-width:180px}
.ed-bar .spacer{flex:1}
.saved{font-size:12px;color:var(--faint);margin-right:6px;white-space:nowrap}
.icon-btn.on{color:var(--accent)}
.ed-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ed-date{font-size:13px;color:var(--faint);text-align:center;padding:14px 0 0}
mark{background:var(--hl);color:inherit;border-radius:2px}
#ed{flex:1;min-height:0;overflow-y:auto;outline:none;padding:14px max(28px, calc(50% - 352px)) 60px;font-family:var(--font);font-size:var(--ed-size,17px);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
#ed.empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none;position:absolute}
#ed[contenteditable="false"]{color:var(--muted)}
#ed [style*="background-color"]{color:#1F2633;border-radius:2px}
#ed [style*="background-color"] [style*="--ink"],#ed [style*="background-color"][style*="--ink"]{color:#1F2633!important}
.sw-default{background:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
#ed b,#ed strong{font-weight:700}
mark{background:var(--hl);color:inherit;border-radius:2px}
::highlight(hl){background-color:var(--hl);text-decoration:underline 2px var(--hl-cur)}
::highlight(hlcur){background-color:var(--hl-cur);text-decoration:underline 2px var(--hl-cur)}
.hits{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hits .icon-btn{width:28px;height:28px;font-size:13px}
.note-item .note-title{display:flex;align-items:center;gap:4px}
.note-title .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-title .hitcount{margin-left:auto;flex:none;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:1px 8px}
.ed-empty{flex:1;display:grid;place-items:center;color:var(--faint);font-size:15px}
.btn{padding:7px 14px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}

/* 대화상자 */
dialog{border:0;border-radius:14px;padding:22px;width:min(360px,calc(100% - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,26,36,.4)}
dialog h3{margin:0 0 14px;font-size:17px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog input[type=text],dialog input[type=email],dialog input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.dlg-actions .left{margin-right:auto}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.err.ok{color:#3E8A55}
.reset-link{display:inline-block;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.scrim{display:none}

/* 태블릿 세로: 폴더는 서랍으로 */
@media (max-width:1023px){
  .app{grid-template-columns:330px minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(20,26,36,.35);z-index:20}
  .menu-btn{display:inline-grid}
}
/* 휴대폰: 목록과 편집기를 번갈아 */
@media (max-width:719px){
  .app{grid-template-columns:minmax(0,1fr)}
  .editor{position:fixed;inset:0;z-index:15;transform:translateX(100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body.editing .editor{transform:none}
  .ed-bar .back{display:inline-grid}
  .ed-bar{gap:2px;padding:8px 8px}
  .ed-bar select{max-width:96px}
  .ed-bar .icon-btn{width:30px}
  .hits:not(.hidden) ~ .saved{display:none}
  #ed{padding:12px 20px 60px}
  .fmt-bar{padding:8px 10px}
  .list{border-right:0}
}
@media (prefers-reduced-motion:reduce){.side,.editor{transition:none}}
.err.ok{color:#3E8A55}
.reset-link{display:inline-block;margin-top:10px}
.desc{font-size:13px;color:var(--muted);margin:0 0 4px;line-height:1.65}
.desc strong{color:var(--danger);font-weight:600}
dialog label.check{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;color:var(--ink)}
dialog label.check input{width:18px;height:18px;accent-color:var(--accent)}
.lockmark{font-size:11px;margin-right:4px;opacity:.8}
.note-item.sealed .note-title{color:var(--muted)}
.ed-locked{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;padding:24px}
.ed-locked .big{font-size:34px}
.empty .btn{margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">영원노트</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="sync" id="sync"><i></i><span>이 기기에만 저장 중</span></div>
      <div class="foot-links">
        <button class="link hidden" id="vaultLockBtn">🔒 지금 잠그기</button>
        <button class="link hidden" id="vaultChangeBtn">잠금 비밀번호 변경</button>
      </div>
      <div class="foot-links">
        <button class="link hidden" id="loginBtn">로그인</button>
        <button class="link hidden" id="logoutBtn">로그아웃</button>
        <button class="link" id="exportBtn">백업 내보내기</button>
        <button class="link" id="importBtn">백업 불러오기</button>
        <input type="file" id="importFile" accept="application/json,.json" class="hidden">
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <section class="list">
    <div class="list-head">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="폴더 열기">☰</button>
      <div class="list-title" id="listTitle">전체 메모</div>
    </div>
    <div class="search"><input type="search" id="q" placeholder="메모 검색" autocomplete="off"></div>
    <div class="trash-bar hidden" id="trashBar"><span>30일이 지나면 자동으로 지워집니다</span><button class="link" id="emptyTrash">비우기</button></div>
    <div class="notes" id="notes"></div>
    <button class="fab" id="newBtn" aria-label="새 메모">+</button>
  </section>

  <main class="editor" id="editor">
    <div class="ed-bar" id="edBar">
      <button class="icon-btn back" id="backBtn" aria-label="목록으로">‹</button>
      <select id="folderSel" aria-label="폴더"></select>
      <span class="spacer"></span>
      <span class="hits hidden" id="hits"><button class="icon-btn" id="hitPrev" aria-label="이전 검색어">▲</button><span id="hitCount"></span><button class="icon-btn" id="hitNext" aria-label="다음 검색어">▼</button></span>
      <span class="saved" id="saved"></span>
      <button class="icon-btn hidden" id="fmtBtn" aria-label="글자색·형광펜·크기" title="글자색·형광펜·크기">가</button>
      <button class="icon-btn" id="lockBtn" aria-label="잠금" title="이 메모 잠그기">🔒</button>
      <button class="icon-btn" id="pinBtn" aria-label="고정" title="맨 위에 고정">📌</button>
      <button class="icon-btn" id="delBtn" aria-label="휴지통으로" title="휴지통으로">🗑</button>
      <button class="btn hidden" id="restoreBtn">복원</button>
      <button class="btn danger hidden" id="purgeBtn">영구 삭제</button>
    </div>
    <div class="fmt-bar hidden" id="fmtBar">
      <div class="fmt-group"><span class="fmt-label">글자색</span>
        <button class="sw sw-default" data-fore="default" aria-label="기본 글자색(검정)" title="기본 글자색"></button>
        <button class="sw" data-fore="#E5484D" style="background:#E5484D" aria-label="빨강 글자"></button>
        <button class="sw" data-fore="#E8820C" style="background:#E8820C" aria-label="주황 글자"></button>
        <button class="sw" data-fore="#2E9E5B" style="background:#2E9E5B" aria-label="초록 글자"></button>
        <button class="sw" data-fore="#2F7FD8" style="background:#2F7FD8" aria-label="파랑 글자"></button>
        <button class="sw" data-fore="#8A5CD6" style="background:#8A5CD6" aria-label="보라 글자"></button>
      </div>
      <div class="fmt-group"><span class="fmt-label">형광펜</span>
        <button class="sw hl-sw" data-hl="#FFF06A" style="background:#FFF06A" aria-label="노랑 형광펜"></button>
        <button class="sw hl-sw" data-hl="#B8F5A0" style="background:#B8F5A0" aria-label="연두 형광펜"></button>
        <button class="sw hl-sw" data-hl="#FFC2DD" style="background:#FFC2DD" aria-label="분홍 형광펜"></button>
        <button class="sw hl-sw" data-hl="#B5E3FF" style="background:#B5E3FF" aria-label="하늘 형광펜"></button>
      </div>
      <div class="fmt-group">
        <button class="fmt-btn" data-cmd="bold" aria-label="굵게"><b>B</b></button>
        <button class="fmt-btn" data-cmd="removeFormat" aria-label="서식 지우기">지우기</button>
      </div>
      <div class="fmt-group fmt-size"><span class="fmt-label">크기</span>
        <button class="fmt-btn" id="fsDown" aria-label="글씨 작게">가−</button><span id="fsVal"></span><button class="fmt-btn" id="fsUp" aria-label="글씨 크게">가+</button>
      </div>
    </div>
    <div class="ed-body" id="edBody">
      <div class="ed-date" id="edDate"></div>
      <div id="ed" contenteditable="true" spellcheck="false" data-ph="첫 줄이 제목이 됩니다"></div>
    </div>
    <div class="ed-locked hidden" id="edLocked">
      <div class="big">🔒</div>
      <div>잠긴 메모입니다</div>
      <button class="btn primary" id="edUnlock">잠금 해제</button>
    </div>
    <div class="ed-empty" id="edEmpty">메모를 선택하거나 새로 만드세요</div>
  </main>
</div>

<dialog id="folderDlg">
  <h3 id="folderDlgTitle">새 폴더</h3>
  <label for="folderName">이름</label>
  <input type="text" id="folderName" maxlength="30">
  <label>색</label>
  <div class="swatches" id="swatches"></div>
  <label for="folderParent">위치</label>
  <select id="folderParent"></select>
  <label class="check"><input type="checkbox" id="folderLock"> 🔒 이 폴더 잠그기 (하위 폴더까지 메모를 모두 암호화)</label>
  <div class="hint hidden" id="folderLockHint">상위 폴더가 잠겨 있어 이 폴더도 자동으로 잠겨 있습니다.</div>
  <div class="dlg-actions">
    <button class="btn danger left hidden" id="folderDel">폴더 삭제</button>
    <button class="btn" id="folderCancel">취소</button>
    <button class="btn primary" id="folderSave">저장</button>

<script>
/* ================================================================
   Firebase 설정값 (기기 간 동기화용). null로 두면 이 기기에만 저장됩니다.
   ================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCGUKBye77Qw6mbU40K8vVks7q3BbWGQLA",
  authDomain: "yeongwon-note.firebaseapp.com",
  projectId: "yeongwon-note",
  storageBucket: "yeongwon-note.firebasestorage.app",
  messagingSenderId: "984325324011",
  appId: "1:984325324011:web:9a31b6988e9f733d55d2ae"
};

const LS_KEY = 'hangyeol.data.v1';
const TRASH_DAYS = 30;
const AUTO_LOCK_IDLE_MIN = 10;   // 아무 조작이 없으면 몇 분 뒤 자동 잠금
const AUTO_LOCK_AWAY_SEC = 60;   // 다른 앱으로 나갔다 몇 초 뒤 돌아오면 잠금
const COLORS = ['#E06C5A','#E3A33B','#5BAA6B','#3E9CA8','#4A78C9','#8A63C7','#C75B98','#7D8590'];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const emptyData = () => ({ folders: {}, notes: {}, meta: {} });

let data = emptyData();
let ui = { view: 'all', noteId: null, q: '' };

/* ---------- 로컬 저장 (계정마다 따로 보관) ---------- */
const GUEST_KEY = LS_KEY + ':guest';
const LAST_UID_KEY = 'hangyeol.lastUid';
let lsKey = GUEST_KEY;
try {
  const old = localStorage.getItem(LS_KEY);
  if (old && !localStorage.getItem(GUEST_KEY)) localStorage.setItem(GUEST_KEY, old);
  localStorage.removeItem(LS_KEY);
  const last = FIREBASE_CONFIG && localStorage.getItem(LAST_UID_KEY);
  if (last) lsKey = LS_KEY + ':' + last;
} catch (e) {}

function loadLocal() {
  try {
    const raw = localStorage.getItem(lsKey);
    if (raw) { const d = JSON.parse(raw); data.folders = d.folders || {}; data.notes = d.notes || {}; data.meta = d.meta || {}; }
  } catch (e) { console.warn(e); }
}
function saveLocal() {
  try { localStorage.setItem(lsKey, JSON.stringify(data)); }
  catch (e) { toast('기기 저장 공간이 부족합니다. 백업을 내보내 주세요.'); }
}

function put(kind, obj, { debounce = false } = {}) {
  obj.updatedAt = Date.now();
  data[kind][obj.id] = obj;
  saveLocal();
  cloud.push(kind, obj, debounce);
}

/* ================================================================
   암호화 금고: 잠금 비밀번호로 만든 열쇠(AES-256-GCM)로 잠긴 메모를 암호화.
   비밀번호와 열쇠는 어디에도 저장되지 않고, 잠금 해제 중에만 메모리에 있습니다.
   ================================================================ */
const CHECK_TEXT = 'yeongwon-vault-ok';
const enc8 = new TextEncoder(), dec8 = new TextDecoder();
function b64e(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

const vault = {
  key: null, salt: null, plain: {}, timers: {}, pending: {},
  get cfg() { const v = data.meta.vault; return v && !v.deleted && v.salt ? v : null; },
  async derive(pw, salt, iter) {
    const base = await crypto.subtle.importKey('raw', enc8.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(salt), iterations: iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async enc(text, key = this.key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc8.encode(text));
    return { iv: b64e(iv), ct: b64e(ct) };
  },
  async dec(o, key = this.key) {
    return dec8.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(o.iv) }, key, b64d(o.ct)));
  },
  async setup(pw) {
    const salt = b64e(crypto.getRandomValues(new Uint8Array(16))), iter = 250000;
    const key = await this.derive(pw, salt, iter);
    const check = await this.enc(CHECK_TEXT, key);
    put('meta', { id: 'vault', salt, iter, check });
    this.key = key; this.salt = salt; touch();
  },
  async unlock(pw) {
    const c = this.cfg;
    const key = await this.derive(pw, c.salt, c.iter);
    try { if (await this.dec(c.check, key) !== CHECK_TEXT) return false; } catch (e) { return false; }
    this.key = key; this.salt = c.salt; touch();
    await this.refresh();
    return true;
  },
  async refresh() { // 잠긴 메모를 메모리에서만 해독
    if (!this.key) return;
    for (const n of Object.values(data.notes)) {
      if (!n.locked || !n.enc || n.deleted || this.pending[n.id]) continue;
      if (this.plain[n.id] && this.plain[n.id].iv === n.enc.iv) continue;
      try { this.plain[n.id] = Object.assign({ iv: n.enc.iv }, parsePayload(await this.dec(n.enc))); }
      catch (e) { delete this.plain[n.id]; }
    }
  },
  schedule(id) {
    this.pending[id] = true;
    clearTimeout(this.timers[id]);
    this.timers[id] = setTimeout(() => this.saveNow(id), 350);
  },
  async saveNow(id) {
    clearTimeout(this.timers[id]);
    const n = data.notes[id], p = this.plain[id];
    if (!this.key || !n || !p) { delete this.pending[id]; return; }
    const html = p.html;
    const e = await this.enc(makePayload(html));
    if (!this.key) return;
    n.enc = e; n.body = ''; n.html = null;
    put('notes', n, { debounce: true });
    if (this.plain[id] && this.plain[id].html === html) { this.plain[id].iv = e.iv; delete this.pending[id]; }
  },
  async flush() { for (const id of Object.keys(this.pending)) await this.saveNow(id); },
  reset() { Object.values(this.timers).forEach(clearTimeout); this.key = null; this.salt = null; this.plain = {}; this.timers = {}; this.pending = {}; },
  async lock() { await this.flush(); this.reset(); renderAll(); }
};

/* ---------- 서식(색·형광펜) 있는 본문 ----------
   unlocked 메모: body = 순수 글자(검색·제목용), html = 서식 포함 본문
   잠긴 메모: enc 안에 {"v":2,"html":...} 를 암호화 (예전 잠긴 메모는 순수 글자) */
const BLOCK_RE = /^(DIV|P|LI|H[1-6]|BLOCKQUOTE|PRE|UL|OL)$/;
function walkText(root, onText) {
  let out = '';
  (function rec(node) {
    for (let c = node.firstChild; c; c = c.nextSibling) {
      if (c.nodeType === 3) { if (onText) onText(c, out.length); out += c.nodeValue; }
      else if (c.nodeType === 1) {
        if (c.tagName === 'BR') { out += '\n'; continue; }
        const block = BLOCK_RE.test(c.tagName);
        if (block && out.length && !out.endsWith('\n')) out += '\n';
        rec(c);
        if (block && !out.endsWith('\n')) out += '\n';
      }
    }
  })(root);
  return out.endsWith('\n') ? out.slice(0, -1) : out;
}
function htmlToText(html) { const t = document.createElement('template'); t.innerHTML = html || ''; return walkText(t.content); }
function textToHtml(text) { return (text || '').split('\n').map(l => l ? `<div>${esc(l)}</div>` : '<div><br></div>').join(''); }
const ALLOWED_TAGS = /^(DIV|P|BR|SPAN|B|STRONG|I|EM|U|FONT)$/;
function sanitize(html) { // 저장된 본문을 화면에 넣기 전, 허용한 서식만 남김
  const t = document.createElement('template'); t.innerHTML = html || '';
  (function clean(node) {
    for (let c = node.firstChild; c; ) {
      const next = c.nextSibling;
      if (c.nodeType === 1) {
        if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|IMG|SVG|VIDEO|AUDIO|FORM|INPUT|TEXTAREA|BUTTON)$/.test(c.tagName)) { c.remove(); }
        else if (!ALLOWED_TAGS.test(c.tagName)) { clean(c); while (c.firstChild) node.insertBefore(c.firstChild, c); c.remove(); }
        else {
          const color = c.style.color || (c.tagName === 'FONT' ? c.getAttribute('color') : '');
          const bg = c.style.backgroundColor, fw = c.style.fontWeight;
          [...c.attributes].forEach(a => c.removeAttribute(a.name));
          if (color) c.style.color = color;
          if (bg) c.style.backgroundColor = bg;
          if (fw) c.style.fontWeight = fw;
          clean(c);
        }
      } else if (c.nodeType !== 3) c.remove();
      c = next;
    }
  })(t.content);
  return t.innerHTML;
}
function parsePayload(raw) {
  if (raw && raw.startsWith('{"v":2')) { try { const o = JSON.parse(raw); return { html: o.html || '', text: htmlToText(o.html) }; } catch (e) {} }
  return { html: textToHtml(raw || ''), text: raw || '' };
}
const makePayload = html => JSON.stringify({ v: 2, html });

/* 잠긴 메모의 내용: 읽을 수 없으면 null */
function textOf(n) {
  if (!n.locked) return n.body || '';
  if (!n.enc) return vault.plain[n.id] ? vault.plain[n.id].text : '';
  return vault.plain[n.id] ? vault.plain[n.id].text : null;
}
function htmlOf(n) {
  if (!n.locked) return n.html || textToHtml(n.body || '');
  const p = vault.plain[n.id];
  return p ? (p.html != null ? p.html : textToHtml(p.text)) : '';
}
const isEmpty = n => { const t = textOf(n); return t !== null && !t.trim(); };
/* ---------- 폴더 안의 폴더 (parentId로 연결) ---------- */
const fAlive = id => { const f = id && data.folders[id]; return f && !f.deleted ? f : null; };
const parentOf = f => (f.parentId && f.parentId !== f.id && fAlive(f.parentId)) ? f.parentId : null;
const sortFolders = arr => arr.sort((a, b) => ((a.order || 0) - (b.order || 0)) || (a.createdAt - b.createdAt));
const childrenOf = pid => sortFolders(Object.values(data.folders).filter(f => !f.deleted && parentOf(f) === pid));
function ancestors(fid) { // 가까운 상위 폴더부터
  const out = []; let cur = fAlive(fid);
  while (cur && out.length < 50) { const p = parentOf(cur); if (!p || out.includes(p) || p === fid) break; out.push(p); cur = fAlive(p); }
  return out;
}
function descendants(fid) {
  const out = [], stack = [fid];
  while (stack.length && out.length < 5000) { const id = stack.pop(); childrenOf(id).forEach(c => { if (c.id !== fid && !out.includes(c.id)) { out.push(c.id); stack.push(c.id); } }); }
  return out;
}
function folderTree() { // 화면에 그릴 순서: [{f, depth}]
  const out = [], seen = new Set();
  (function rec(pid, depth) { childrenOf(pid).forEach(f => { if (seen.has(f.id)) return; seen.add(f.id); out.push({ f, depth }); rec(f.id, depth + 1); }); })(null, 0);
  Object.values(data.folders).forEach(f => { if (!f.deleted && !seen.has(f.id)) { seen.add(f.id); out.push({ f, depth: 0 }); } });
  return out;
}
const folderPath = fid => [...ancestors(fid).reverse(), fid].map(id => data.folders[id].name).join(' › ');
/* 이 폴더나 상위 폴더 중 하나라도 잠겨 있으면 잠긴 것으로 봄 */
const folderLocked = fid => { const f = fAlive(fid); if (!f) return false; return !!f.locked || ancestors(fid).some(a => data.folders[a].locked); };

async function lockNote(n) {
  const text = n.body || '', html = htmlOf(n);
  const e = await vault.enc(makePayload(html));
  n.locked = true; n.enc = e; n.body = ''; n.html = null;
  vault.plain[n.id] = { iv: e.iv, text, html };
  put('notes', n);
}
async function unlockNote(n) {
  if (vault.pending[n.id]) await vault.saveNow(n.id);
  const t = textOf(n);
  if (t === null) return false;
  n.html = htmlOf(n);
  n.locked = false; n.body = t; n.enc = null;
  delete vault.plain[n.id];
  put('notes', n);
  return true;
}

/* 잠금 비밀번호 대화상자 */
let vaultResolve = null, vaultMode = 'unlock';
function openVault(mode) {
  if (!window.crypto || !crypto.subtle) { toast('이 환경에서는 암호화를 쓸 수 없습니다 (https 주소에서 열어 주세요)'); return Promise.resolve(false); }
  vaultMode = mode;
  const T = {
    setup: ['잠금 비밀번호 만들기', '잠긴 폴더와 메모를 열 때 쓰는 비밀번호입니다. 로그인 비밀번호와 다르게 정하세요.<br><strong>이 비밀번호를 잊으면 잠긴 메모는 누구도(관리자도) 되살릴 수 없습니다.</strong> 꼭 따로 적어 두세요.', '새 잠금 비밀번호 (6자 이상)'],
    unlock: ['잠금 해제', '잠금 비밀번호를 입력하세요.', '잠금 비밀번호'],
    change: ['잠금 비밀번호 변경', '잠긴 메모를 모두 새 비밀번호로 다시 암호화합니다. 다른 기기에서는 새 비밀번호로 다시 잠금 해제해야 합니다.', '새 잠금 비밀번호 (6자 이상)']
  }[mode];
  $('vTitle').textContent = T[0]; $('vDesc').innerHTML = T[1]; $('vPw1Label').textContent = T[2];
  $('vOldWrap').classList.toggle('hidden', mode !== 'change');
  $('vPw2Wrap').classList.toggle('hidden', mode === 'unlock');
  ['vOld', 'vPw1', 'vPw2'].forEach(id => $(id).value = '');
  $('vErr').textContent = ''; $('vOk').disabled = false; $('vOk').textContent = '확인';
  $('vaultDlg').showModal();
  setTimeout(() => $(mode === 'change' ? 'vOld' : 'vPw1').focus(), 40);
  return new Promise(res => { vaultResolve = res; });
}
function closeVault(ok) { $('vaultDlg').close(); const r = vaultResolve; vaultResolve = null; r && r(ok); }
$('vCancel').onclick = () => closeVault(false);
$('vaultDlg').addEventListener('cancel', e => { e.preventDefault(); closeVault(false); });
['vOld', 'vPw1', 'vPw2'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('vOk').click(); }));
$('vOk').onclick = async () => {
  const p1 = $('vPw1').value, p2 = $('vPw2').value, err = $('vErr');
  err.textContent = '';
  if (vaultMode !== 'unlock') {
    if (p1.length < 6) { err.textContent = '6자 이상으로 정하세요'; return; }
    if (p1 !== p2) { err.textContent = '두 번 입력한 비밀번호가 다릅니다'; return; }
  } else if (!p1) return;
  $('vOk').disabled = true; $('vOk').textContent = '확인 중…';
  try {
    if (vaultMode === 'setup') { await vault.setup(p1); closeVault(true); }
    else if (vaultMode === 'unlock') {
      if (await vault.unlock(p1)) closeVault(true);
      else { err.textContent = '잠금 비밀번호가 맞지 않습니다'; $('vPw1').select(); }
    } else {
      const ok = await changeVaultPw($('vOld').value, p1);
      if (ok === true) { closeVault(true); toast('잠금 비밀번호를 바꿨습니다'); }
      else err.textContent = ok;
    }
  } catch (e) { console.warn(e); err.textContent = '처리 중 오류가 났습니다: ' + e.message; }
  $('vOk').disabled = false; $('vOk').textContent = '확인';
};

async function changeVaultPw(oldPw, newPw) {
  const c = vault.cfg;
  const oldKey = await vault.derive(oldPw, c.salt, c.iter);
  try { if (await vault.dec(c.check, oldKey) !== CHECK_TEXT) return '현재 잠금 비밀번호가 맞지 않습니다'; }
  catch (e) { return '현재 잠금 비밀번호가 맞지 않습니다'; }
  if (vault.key) await vault.flush();
  const locked = Object.values(data.notes).filter(n => n.locked && n.enc && !n.deleted);
  const texts = {};
  for (const n of locked) {
    try { texts[n.id] = await vault.dec(n.enc, oldKey); }
    catch (e) { return '일부 잠긴 메모를 열 수 없어 변경을 멈췄습니다. 다른 기기의 동기화를 기다린 뒤 다시 해 보세요.'; }
  }
  const salt = b64e(crypto.getRandomValues(new Uint8Array(16))), iter = 250000;
  const newKey = await vault.derive(newPw, salt, iter);
  vault.reset();
  for (const n of locked) {
    const e = await vault.enc(texts[n.id], newKey);
    n.enc = e; put('notes', n);
    vault.plain[n.id] = Object.assign({ iv: e.iv }, parsePayload(texts[n.id]));
  }
  put('meta', { id: 'vault', salt, iter, check: await vault.enc(CHECK_TEXT, newKey) });
  vault.key = newKey; vault.salt = salt; touch();
  renderAll();
  return true;
}

async function ensureKey() {
  if (vault.key) return true;
  return openVault(vault.cfg ? 'unlock' : 'setup');
}

/* 자동 잠금 */
let lastActive = Date.now(), hiddenAt = 0;
function touch() { lastActive = Date.now(); }
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, touch, { passive: true }));
setInterval(() => { if (vault.key && Date.now() - lastActive > AUTO_LOCK_IDLE_MIN * 60000) vault.lock(); }, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); vault.flush(); }
  else if (vault.key && hiddenAt && Date.now() - hiddenAt > AUTO_LOCK_AWAY_SEC * 1000) vault.lock();
});
$('vaultLockBtn').onclick = () => { vault.lock(); toast('잠갔습니다'); };
$('vaultChangeBtn').onclick = () => openVault('change');

/* ---------- 데이터 도우미 ---------- */
const liveFolders = () => Object.values(data.folders).filter(f => !f.deleted).sort((a, b) => (a.order - b.order) || (a.createdAt - b.createdAt));
const liveNotes = () => Object.values(data.notes).filter(n => !n.deleted);
function titleOf(n) {
  const t = textOf(n);
  if (t === null) return '잠긴 메모';
  const l = t.split('\n').find(s => s.trim());
  return l ? l.trim().slice(0, 60) : '새 메모';
}
/* ---------- 검색과 형광펜 ---------- */
// 검색어 전체를 한 덩어리로, 띄어쓰기까지 정확히 일치하는 부분만 찾음 (영문 대소문자는 구분 안 함)
const searchTerms = () => { const q = ui.q.trim().toLowerCase(); return q ? [q] : []; };
function termRegex() {
  const t = searchTerms();
  if (!t.length) return null;
  return new RegExp(t.slice().sort((a, b) => b.length - a.length).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
}
function hlHtml(text, re) {
  if (!re) return esc(text);
  let out = '', last = 0;
  text.replace(re, (m, off) => { out += esc(text.slice(last, off)) + '<mark>' + esc(m) + '</mark>'; last = off + m.length; return m; });
  return out + esc(text.slice(last));
}
function snippetOf(n, re) { // 검색어가 있는 부분을 미리보기로
  const t = textOf(n);
  if (t === null || !re) return null;
  const lines = t.split('\n'), first = lines.findIndex(s => s.trim());
  const rest = lines.slice(first + 1).filter(s => s.trim()).join(' ');
  re.lastIndex = 0;
  const m = re.exec(rest);
  if (!m) return null;
  const from = Math.max(0, m.index - 18);
  return (from > 0 ? '…' : '') + rest.slice(from, from + 90);
}

function previewOf(n) {
  const t = textOf(n);
  if (t === null) return '잠금 해제 후 볼 수 있습니다';
  return t.split('\n').filter(s => s.trim()).slice(1).join(' ').slice(0, 80) || '추가 내용 없음';
}
function fmtDate(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toTimeString().slice(0, 5);
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}월 ${d.getDate()}일`;
  return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}
function fmtFull(t) { const d = new Date(t); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${d.toTimeString().slice(0, 5)}`; }

function purgeOldTrash() {
  const limit = Date.now() - TRASH_DAYS * 864e5;
  liveNotes().forEach(n => { if (n.trashed && n.trashedAt < limit) put('notes', { id: n.id, deleted: true }); });
}

/* ---------- 화면 그리기 ---------- */
let hitCounts = {};
function viewNotes() {
  let list = liveNotes();
  const terms = searchTerms();
  if (terms.length) { // 검색할 때는 폴더와 상관없이 전체에서 찾음 (휴지통에서는 휴지통 안에서)
    const q = terms[0];
    hitCounts = {};
    list = list.filter(n => !!n.trashed === (ui.view === 'trash')).filter(n => {
      const t = textOf(n); if (t === null) return false;
      const low = t.toLowerCase();
      let c = 0, i = low.indexOf(q);
      while (i !== -1) { c++; i = low.indexOf(q, i + q.length); }
      if (c) hitCounts[n.id] = c;
      return c > 0;
    });
    // 검색어가 많이 나온 메모부터, 같으면 최근에 고친 메모부터
    return list.sort((a, b) => (hitCounts[b.id] - hitCounts[a.id]) || (b.updatedAt - a.updatedAt));
  }
  if (ui.view === 'trash') list = list.filter(n => n.trashed);
  else {
    list = list.filter(n => !n.trashed);
    if (ui.view === 'unfiled') list = list.filter(n => !n.folderId || !data.folders[n.folderId] || data.folders[n.folderId].deleted);
    else if (ui.view !== 'all') list = list.filter(n => n.folderId === ui.view);
  }
  return list.sort((a, b) => ui.view === 'trash' ? b.trashedAt - a.trashedAt : (!!b.pinned - !!a.pinned) || (b.updatedAt - a.updatedAt));
}
function viewName() {
  if (ui.view === 'all') return '전체 메모';
  if (ui.view === 'unfiled') return '폴더 없음';
  if (ui.view === 'trash') return '휴지통';
  const f = fAlive(ui.view);
  return f ? (folderLocked(f.id) ? '🔒 ' : '') + folderPath(f.id) : '전체 메모';
}

let collapsed = new Set();
try { collapsed = new Set(JSON.parse(localStorage.getItem('hangyeol.collapsed') || '[]')); } catch (e) {}
const saveCollapsed = () => { try { localStorage.setItem('hangyeol.collapsed', JSON.stringify([...collapsed])); } catch (e) {} };

  const total = fid => [fid, ...descendants(fid)].reduce((sum, id) => sum + cnt(id), 0);

          <button class="icon-btn edit" data-edit="${f.id}" aria-label="${esc(f.name)} 폴더 편집">⋯</button></div>`;
  });
  h += `<div style="height:12px"></div>` + item('trash', '<span class="ico">🗑</span>', '휴지통', trash);
  $('nav').innerHTML = h;

}

function renderList() {
  $('listTitle').textContent = viewName();
  $('trashBar').classList.toggle('hidden', ui.view !== 'trash');
  const sealedFolder = folderLocked(ui.view) && !vault.key;
  $('newBtn').classList.toggle('hidden', ui.view === 'trash' || sealedFolder);

  const list = viewNotes();

  }).join('') + (subs.length ? '<div class="sub-sep"></div>' : '');

  }
  if (!list.length) {
    $('notes').innerHTML = subHtml + `<div class="empty">${ui.q ? '검색 결과가 없습니다' : ui.view === 'trash' ? '휴지통이 비어 있습니다' : '+ 버튼으로 첫 메모를 써 보세요'}</div>`;

      <div class="note-title">${n.pinned && !n.trashed ? '<span class="pin">●</span>' : ''}${n.locked ? '<span class="lockmark">🔒</span>' : ''}<span class="tt">${hlHtml(titleOf(n), sealed ? null : re)}</span>${re && hitCounts[n.id] ? `<span class="hitcount">${hitCounts[n.id]}회</span>` : ''}</div>
      <div class="note-meta"><time>${fmtDate(ui.view === 'trash' ? n.trashedAt : n.updatedAt)}</time><span>${(() => { const sn = snippetOf(n, re); return sn ? hlHtml(sn, re) : esc(previewOf(n)); })()}</span></div>
    </button>`;
  }).join('');
}

let hitIdx = 0, hitRanges = [];
const canHL = !!(window.CSS && CSS.highlights && window.Highlight);
function renderHL(jump) {
  const n = ui.noteId && data.notes[ui.noteId], ed = $('ed');
  if (canHL) { CSS.highlights.delete('hl'); CSS.highlights.delete('hlcur'); }
  hitRanges = [];
  const q = n && textOf(n) !== null ? (searchTerms()[0] || '') : '';
  if (!q) { $('hits').classList.add('hidden'); return; }
  const nodes = [];
  const low = walkText(ed, (node, start) => nodes.push([node, start])).toLowerCase();
  const locate = pos => { // 전체 글자 위치 → (글자 노드, 노드 안 위치)
    for (let i = nodes.length - 1; i >= 0; i--) if (nodes[i][1] <= pos) return [nodes[i][0], Math.min(pos - nodes[i][1], nodes[i][0].nodeValue.length)];
    return null;
  };
  for (let i = low.indexOf(q); i !== -1; i = low.indexOf(q, i + q.length)) {
    const a = locate(i), b = locate(i + q.length - 1);
    if (!a || !b) continue;
    const r = document.createRange();
    try { r.setStart(a[0], a[1]); r.setEnd(b[0], b[1] + 1); hitRanges.push(r); } catch (e) {}
  }
  $('hits').classList.toggle('hidden', !hitRanges.length);
  if (!hitRanges.length) return;
  if (jump) hitIdx = 0;
  hitIdx = Math.min(hitIdx, hitRanges.length - 1);
  paintHits(jump);
}
function paintHits(scroll) {
  $('hitCount').textContent = `${hitIdx + 1}/${hitRanges.length}`;
  if (canHL) {
    CSS.highlights.set('hl', new Highlight(...hitRanges.filter((r, i) => i !== hitIdx)));
    CSS.highlights.set('hlcur', new Highlight(hitRanges[hitIdx]));
  }
  if (scroll) {
    const ed = $('ed'), r = hitRanges[hitIdx].getBoundingClientRect(), box = ed.getBoundingClientRect();
    ed.scrollTop += r.top - box.top - ed.clientHeight / 3;
  }
}
function stepHit(d) {
  if (!hitRanges.length) return;
  hitIdx = (hitIdx + d + hitRanges.length) % hitRanges.length;
  paintHits(true);
}
$('hitPrev').onclick = () => stepHit(-1);
$('hitNext').onclick = () => stepHit(1);

let edSrc = null, edNote = null; // 편집기에 지금 들어 있는 본문의 원본 (타이핑 중 커서가 튀지 않게)
function setEdContent(id, html) {
  if (edNote === id && edSrc === html) return;
  const ed = $('ed');
  ed.innerHTML = sanitize(html);
  edSrc = html; edNote = id;
  ed.scrollTop = 0;
  updateEmpty();
}
function updateEmpty() { const ed = $('ed'); ed.classList.toggle('empty', !walkText(ed).trim()); }

function renderEditor(jump) {
  const n = ui.noteId && data.notes[ui.noteId];
  const has = n && !n.deleted;
  const sealed = has && textOf(n) === null;
  $('edBody').classList.toggle('hidden', !has || sealed);
  $('edLocked').classList.toggle('hidden', !sealed);
  $('edEmpty').classList.toggle('hidden', !!has);
  ['folderSel', 'lockBtn', 'pinBtn', 'delBtn', 'restoreBtn', 'purgeBtn', 'saved', 'hits', 'fmtBtn'].forEach(id => $(id).classList.add('hidden'));
  $('fmtBar').classList.add('hidden');
  if (!has || sealed) { edNote = null; edSrc = null; }
  if (!has) return;
  if (sealed) { if (!n.trashed) $('delBtn').classList.remove('hidden'); else $('purgeBtn').classList.remove('hidden'); return; }
  const ed = $('ed');
  setEdContent(n.id, htmlOf(n));
  ed.contentEditable = n.trashed ? 'false' : 'true';
  $('fmtBtn').classList.remove('hidden');
  $('fmtBar').classList.toggle('hidden', !fmtOpen || !!n.trashed);
  $('fmtBtn').classList.toggle('on', fmtOpen && !n.trashed);
  requestAnimationFrame(() => renderHL(jump));
  $('edDate').textContent = fmtFull(n.updatedAt) + (n.locked ? ' · 🔒 암호화됨' : '');
  if (n.trashed) { $('restoreBtn').classList.remove('hidden'); $('purgeBtn').classList.remove('hidden'); return; }
  const sel = $('folderSel');
  sel.innerHTML = `<option value="">폴더 없음</option>` + folderTree().map(({ f, depth }) => `<option value="${f.id}">${'\u00A0\u00A0'.repeat(depth)}${depth ? '└ ' : ''}${f.locked ? '🔒 ' : ''}${esc(f.name)}</option>`).join('');
  sel.value = n.folderId && data.folders[n.folderId] && !data.folders[n.folderId].deleted ? n.folderId : '';
  ['folderSel', 'lockBtn', 'pinBtn', 'delBtn', 'saved'].forEach(id => $(id).classList.remove('hidden'));
  $('pinBtn').classList.toggle('on', !!n.pinned);
  $('lockBtn').classList.toggle('on', !!n.locked);
  $('lockBtn').title = n.locked ? '잠금 풀기' : '이 메모 잠그기';
}

function renderAll() { renderNav(); renderList(); renderEditor(); }

/* ---------- 글자색·형광펜·굵게 / 글씨 크기 ---------- */
const FS_KEY = 'hangyeol.fontSize', FS_MIN = 13, FS_MAX = 32;
let fontSize = 17, fmtOpen = false;
try { fontSize = Math.min(FS_MAX, Math.max(FS_MIN, parseInt(localStorage.getItem(FS_KEY), 10) || 17)); } catch (e) {}
function applyFont() {
  document.documentElement.style.setProperty('--ed-size', fontSize + 'px');
  $('fsVal').textContent = fontSize + 'px';
  $('fsDown').disabled = fontSize <= FS_MIN; $('fsUp').disabled = fontSize >= FS_MAX;
  try { localStorage.setItem(FS_KEY, fontSize); } catch (e) {}
  requestAnimationFrame(() => renderHL(false));
}
$('fmtBtn').onclick = () => { fmtOpen = !fmtOpen; $('fmtBar').classList.toggle('hidden', !fmtOpen); $('fmtBtn').classList.toggle('on', fmtOpen); };

let savedRange = null; // 버튼을 누를 때 선택 영역이 사라지지 않게 기억
document.addEventListener('selectionchange', () => {
  const s = window.getSelection();
  if (s.rangeCount && $('ed').contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange();
});
function restoreSel() {
  const ed = $('ed');
  if (document.activeElement !== ed) ed.focus({ preventScroll: true });
  if (savedRange && ed.contains(savedRange.startContainer)) { const s = window.getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
}
function applyFormat(btn) {
  const n = data.notes[ui.noteId];
  if (!n || n.trashed || (n.locked && !vault.key)) return;
  restoreSel();
  try { document.execCommand('styleWithCSS', false, true); } catch (e) {}
  if (btn.dataset.fore === 'default') { // 기본색: 화면 모드에 맞는 기본 글자색(밝은 화면=검정, 어두운 화면=흰색)
    document.execCommand('foreColor', false, '#010203');
    $('ed').querySelectorAll('[style*="color"], font[color]').forEach(el => {
      const c = (el.style.color || el.getAttribute('color') || '').replace(/\s/g, '').toLowerCase();
      if (c === 'rgb(1,2,3)' || c === '#010203') { el.removeAttribute('color'); el.style.color = 'var(--ink)'; }
    });
  }
  else if (btn.dataset.fore) document.execCommand('foreColor', false, btn.dataset.fore);
  else if (btn.dataset.hl) { if (!document.execCommand('hiliteColor', false, btn.dataset.hl)) document.execCommand('backColor', false, btn.dataset.hl); }
  else if (btn.dataset.cmd) document.execCommand(btn.dataset.cmd, false, null);
  onEdInput();
}
$('fmtBar').addEventListener('pointerdown', e => {
  const b = e.target.closest('button'); if (!b) return;
  e.preventDefault(); // 편집기의 선택 영역 유지
  if (b.id === 'fsDown') { fontSize = Math.max(FS_MIN, fontSize - 1); applyFont(); }
  else if (b.id === 'fsUp') { fontSize = Math.min(FS_MAX, fontSize + 1); applyFont(); }
  else applyFormat(b);
});
$('fmtBar').addEventListener('click', e => e.preventDefault());
applyFont();

/* ---------- 동작 ---------- */
const isPhone = () => matchMedia('(max-width:719px)').matches;
const discard = n => put('notes', { id: n.id, deleted: true });

function openNote(id) {
  const prev = data.notes[ui.noteId];
  if (prev && prev.id !== id && !prev.trashed && !prev.deleted && isEmpty(prev)) discard(prev);
  ui.noteId = id;
  renderList(); renderEditor(true);
  if (isPhone() && !document.body.classList.contains('editing')) {
    document.body.classList.add('editing');
    history.pushState({ editing: true }, '');
  }
}
function closeEditor() {
  document.body.classList.remove('editing');
  const n = data.notes[ui.noteId];
  if (n && !n.trashed && !n.deleted && isEmpty(n)) { discard(n); ui.noteId = null; }
  renderAll();
}

async function newNote() {
  const folderId = data.folders[ui.view] && !data.folders[ui.view].deleted ? ui.view : null;
  const lock = folderLocked(folderId);
  if (lock && !(await ensureKey())) return;
  const n = { id: newId(), body: '', folderId, pinned: false, trashed: false, trashedAt: 0, createdAt: Date.now(), locked: lock, enc: null };
  if (lock) vault.plain[n.id] = { iv: null, text: '', html: '' };
  put('notes', n);
  ui.q = ''; $('q').value = '';
  if (ui.view === 'trash') ui.view = 'all';
  renderNav(); openNote(n.id);
  setTimeout(() => $('ed').focus(), 60);
}

let savedTimer;
function onEdInput() {
  const n = data.notes[ui.noteId];
  if (!n || n.trashed) return;
  const ed = $('ed'), html = ed.innerHTML, text = walkText(ed);
  edSrc = html; edNote = n.id;
  if (n.locked) {
    if (!vault.key) return;
    vault.plain[n.id] = { iv: vault.plain[n.id] ? vault.plain[n.id].iv : null, text, html };
    vault.schedule(n.id);
  } else { n.body = text; n.html = html; put('notes', n, { debounce: true }); }
  updateEmpty();
  renderHL(false);
  $('saved').textContent = '저장 중…';
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => { $('saved').textContent = n.locked ? '암호화 저장됨' : '저장됨'; renderList(); }, 600);
}
$('ed').addEventListener('input', onEdInput);
$('ed').addEventListener('paste', e => { // 붙여넣기는 글자만 (다른 곳의 서식·위험한 코드 차단)
  const t = e.clipboardData && e.clipboardData.getData('text/plain');
  if (t == null) return;
  e.preventDefault();
  document.execCommand('insertText', false, t);
});
$('ed').addEventListener('drop', e => e.preventDefault());
try { document.execCommand('defaultParagraphSeparator', false, 'div'); } catch (e) {}

$('folderSel').addEventListener('change', async e => {
  const n = data.notes[ui.noteId]; if (!n) return;
  const to = e.target.value || null;
  if (folderLocked(to) && !n.locked) {
    if (!(await ensureKey())) { renderEditor(); return; }

$('lockBtn').onclick = async () => {
  const n = data.notes[ui.noteId]; if (!n) return;
  if (!n.locked) {
    if (!(await ensureKey())) return;
    await lockNote(n); toast('메모를 잠갔습니다');

    if (folderLocked(n.folderId)) { toast('잠긴 폴더 안의 메모입니다. 폴더 밖으로 옮긴 뒤 풀 수 있습니다'); return; }

    if (await unlockNote(n)) toast('잠금을 풀었습니다');
  }
  renderAll();
};
$('edUnlock').onclick = async () => { if (await ensureKey()) renderAll(); };
$('pinBtn').onclick = () => { const n = data.notes[ui.noteId]; if (!n) return; n.pinned = !n.pinned; put('notes', n); renderList(); renderEditor(); };
$('delBtn').onclick = async () => {
  const n = data.notes[ui.noteId]; if (!n) return;
  if (vault.pending[n.id]) await vault.saveNow(n.id);
  if (isEmpty(n)) discard(n);
  else { n.trashed = true; n.trashedAt = Date.now(); put('notes', n); toast('휴지통으로 옮겼습니다'); }

$('restoreBtn').onclick = () => {

  if (n.folderId && (!data.folders[n.folderId] || data.folders[n.folderId].deleted)) n.folderId = null;
  put('notes', n); toast('복원했습니다'); ui.noteId = null;
  if (isPhone()) history.back(); else renderAll();
};
$('purgeBtn').onclick = () => {

  const t = liveNotes().filter(n => n.trashed);

});
$('notes').addEventListener('click', async e => {
  if (e.target.closest('[data-unlock]')) { if (await ensureKey()) renderAll(); return; }
  const go = e.target.closest('[data-goto]');
  if (go) { ui.view = go.dataset.goto; ui.noteId = null; ancestors(ui.view).forEach(a => collapsed.delete(a)); saveCollapsed(); renderAll(); return; }
  const it = e.target.closest('[data-id]'); if (it) openNote(it.dataset.id);
});
$('newBtn').onclick = newNote;
$('q').addEventListener('input', e => { ui.q = e.target.value; renderList(); renderHL(true); });
$('q').addEventListener('keydown', e => { // 엔터: 첫 번째 결과 열기
  if (e.key !== 'Enter') return;
  const first = $('notes').querySelector('[data-id]');
  if (first) { e.preventDefault(); $('q').blur(); openNote(first.dataset.id); }
});
$('menuBtn').onclick = () => document.body.classList.add('drawer');
$('scrim').onclick = () => document.body.classList.remove('drawer');
$('backBtn').onclick = () => history.back();
window.addEventListener('popstate', () => { if (document.body.classList.contains('editing')) closeEditor(); });
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); newNote(); } });

/* ---------- 폴더 편집 ---------- */
let folderEditing = null, folderColor = COLORS[4];
function openFolderDlg(id) {
  folderEditing = id;
  const f = id ? data.folders[id] : null;
  $('folderDlgTitle').textContent = f ? '폴더 편집' : '새 폴더';
  $('folderName').value = f ? f.name : '';
  folderColor = f ? f.color : COLORS[liveFolders().length % COLORS.length];
  const banned = f ? new Set([f.id, ...descendants(f.id)]) : new Set(); // 자기 자신이나 하위 폴더 안으로는 옮길 수 없음
  const parent = f ? parentOf(f) : (fAlive(ui.view) ? ui.view : null);
  $('folderParent').innerHTML = `<option value="">맨 위 (상위 폴더 없음)</option>` + folderTree().filter(({ f: x }) => !banned.has(x.id))
    .map(({ f: x, depth }) => `<option value="${x.id}">${'\u00A0\u00A0'.repeat(depth)}${depth ? '└ ' : ''}${esc(x.name)} 안에</option>`).join('');
  $('folderParent').value = parent || '';
  $('folderLock').checked = !!(f && f.locked);
  updateLockHint();
  $('folderDel').classList.toggle('hidden', !f);
  drawSwatches();
  $('folderDlg').showModal();
  setTimeout(() => $('folderName').focus(), 30);
}
function updateLockHint() {
  const pid = $('folderParent').value || null;
  const inherited = !!pid && folderLocked(pid);
  $('folderLockHint').classList.toggle('hidden', !inherited);
  $('folderLock').disabled = inherited;
  if (inherited) $('folderLock').checked = true;
  else if (folderEditing) $('folderLock').checked = !!(data.folders[folderEditing] || {}).locked;
}
$('folderParent').addEventListener('change', updateLockHint);
function drawSwatches() {
  $('swatches').innerHTML = COLORS.map(c => `<button class="swatch ${c === folderColor ? 'on' : ''}" data-c="${c}" style="background:${c}" aria-label="색 ${c}"></button>`).join('');
}
$('swatches').onclick = e => { const s = e.target.closest('[data-c]'); if (s) { folderColor = s.dataset.c; drawSwatches(); } };
$('folderCancel').onclick = () => $('folderDlg').close();
$('folderSave').onclick = async () => {
  const name = $('folderName').value.trim();
  if (!name) return $('folderName').focus();
  const parentId = $('folderParent').value || null;
  const ownLock = $('folderLock').disabled ? !!(folderEditing && data.folders[folderEditing].locked) : $('folderLock').checked;
  const f = folderEditing ? data.folders[folderEditing] : null;
  if (f) {
    const subtree = new Set([f.id, ...descendants(f.id)]);
    const inside = liveNotes().filter(n => subtree.has(n.folderId));
    const wasEff = {}; inside.forEach(n => wasEff[n.id] = folderLocked(n.folderId));
    const old = { name: f.name, color: f.color, locked: f.locked, parentId: f.parentId };
    Object.assign(f, { name, color: folderColor, locked: ownLock, parentId });
    const toLock = inside.filter(n => folderLocked(n.folderId) && !n.locked);
    const toUnlock = inside.filter(n => !folderLocked(n.folderId) && wasEff[n.id] && n.locked);
    if (toLock.length || toUnlock.length || ownLock !== !!old.locked) {
      if (toUnlock.length && !confirm(`잠금을 풀면 메모 ${toUnlock.length}개의 암호화도 풀립니다. 계속할까요?`)) { Object.assign(f, old); return; }
      if (!(await ensureKey())) { Object.assign(f, old); return; }
    }
    put('folders', f);
    for (const n of toLock) await lockNote(n);
    for (const n of toUnlock) await unlockNote(n);
    if (toLock.length) toast(`메모 ${toLock.length}개를 암호화했습니다`);
  } else {
    if (ownLock && !(await ensureKey())) return;
    const siblings = childrenOf(parentId);
    const order = siblings.reduce((m, x) => Math.max(m, x.order || 0), 0) + 1;
    put('folders', { id: newId(), name, color: folderColor, order, createdAt: Date.now(), locked: ownLock, parentId });
    if (parentId) { ancestors(parentId).concat(parentId).forEach(a => collapsed.delete(a)); saveCollapsed(); }
  }
  $('folderDlg').close(); renderAll();
};
$('folderName').addEventListener('keydown', e => { if (e.key === 'Enter') $('folderSave').click(); });
$('folderDel').onclick = () => {
  const f = data.folders[folderEditing]; if (!f) return;
  const subtree = [f.id, ...descendants(f.id)];
  const inside = liveNotes().filter(n => subtree.includes(n.folderId) && !n.trashed);
  const subCount = subtree.length - 1;
  let msg = `'${f.name}' 폴더를 삭제할까요?`;
  if (subCount) msg += `\n하위 폴더 ${subCount}개도 함께 삭제됩니다.`;
  if (inside.length) msg += `\n안에 있는 메모 ${inside.length}개는 휴지통으로 옮겨집니다.`;
  if (!confirm(msg)) return;
  inside.forEach(n => { n.trashed = true; n.trashedAt = Date.now(); put('notes', n); });
  subtree.forEach(id => put('folders', { id, deleted: true }));
  if (subtree.includes(ui.view)) ui.view = 'all';
  ui.noteId = null; $('folderDlg').close(); renderAll();
};

/* ---------- 백업 (잠긴 메모는 암호화된 채로 저장) ---------- */
$('exportBtn').onclick = async () => {
  if (vault.key) await vault.flush();
  const out = { app: 'hangyeol-note', version: 2, exportedAt: new Date().toISOString(),
    folders: liveFolders(), notes: liveNotes(), vault: vault.cfg };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'), d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `영원노트_백업_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'hangyeol-note') throw new Error('형식');
    let note = '';
    if (d.vault) {
      if (!vault.cfg) put('meta', Object.assign({}, d.vault, { id: 'vault' }));
      else if (vault.cfg.salt !== d.vault.salt) note = ' (백업의 잠긴 메모는 지금 잠금 비밀번호로 열리지 않을 수 있습니다)';
    }
    let added = 0;
    (d.folders || []).forEach(f => { const cur = data.folders[f.id]; if (!cur || cur.updatedAt < f.updatedAt) { data.folders[f.id] = f; cloud.push('folders', f); } });
    (d.notes || []).forEach(n => { const cur = data.notes[n.id]; if (!cur || cur.updatedAt < n.updatedAt) { data.notes[n.id] = n; cloud.push('notes', n); added++; } });
    saveLocal(); await vault.refresh(); renderAll(); toast(`메모 ${added}개를 불러왔습니다` + note);
  } catch (err) { toast('영원노트 백업 파일이 아닙니다'); }
};

/* ---------- 알림 ---------- */
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function setSync(state, text) { const s = $('sync'); s.className = 'sync ' + state; s.querySelector('span').textContent = text; }

/* ---------- Firebase 동기화 ---------- */
const KINDS = ['folders', 'notes', 'meta'];
const cloud = {
  fs: null, user: null, unsubs: [], timers: {},
  col(kind) { return this.fs.collection('users').doc(this.user.uid).collection(kind); },
  push(kind, obj, debounce) {
    if (!this.fs || !this.user) return;
    const key = kind + obj.id;
    clearTimeout(this.timers[key]);
    const send = () => {
      const clean = JSON.parse(JSON.stringify(data[kind][obj.id] || obj));
      this.col(kind).doc(obj.id).set(clean).catch(e => { console.warn(e); setSync('err', '동기화 실패 — 다시 시도 중'); });
    };
    debounce ? (this.timers[key] = setTimeout(send, 700)) : send();
  },
  start() {
    this.stop();
    setSync('busy', '동기화 중…');
    KINDS.forEach(kind => {
      let first = true;
      const un = this.col(kind).onSnapshot({ includeMetadataChanges: true }, async snap => {
        let changed = false;
        snap.docChanges().forEach(ch => {
          if (ch.type === 'removed') return;
          const r = ch.doc.data(), l = data[kind][ch.doc.id];
          if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) { data[kind][ch.doc.id] = r; changed = true; }
        });
        if (first && !snap.metadata.fromCache) {
          first = false;
          const remote = {}; snap.docs.forEach(d => remote[d.id] = d.data());
          Object.values(data[kind]).forEach(l => { const r = remote[l.id]; if (!r || (l.updatedAt || 0) > (r.updatedAt || 0)) this.push(kind, l); });
        }
        if (changed) {
          saveLocal();
          if (vault.key && vault.cfg && vault.salt !== vault.cfg.salt) { vault.reset(); toast('잠금 비밀번호가 바뀌어 다시 잠겼습니다'); }
          await vault.refresh();
          const editing = document.activeElement === $('ed');
          renderNav(); renderList();
          if (!editing) renderEditor();
        }
        if (snap.metadata.fromCache) setSync('busy', '오프라인 — 연결되면 동기화');
        else if (snap.metadata.hasPendingWrites) setSync('busy', '동기화 중…');
        else setSync('ok', `동기화됨 · ${this.user.email}`);
      }, err => { console.warn(err); setSync('err', '동기화 권한 오류 — 보안 규칙을 확인하세요'); });
      this.unsubs.push(un);
    });
  },
  stop() { this.unsubs.forEach(u => u()); this.unsubs = []; }
};

/* 계정 전환: 각자 자기 메모만 보이도록 */
function switchUser(uid) {
  cloud.stop();
  vault.reset();
  lsKey = uid ? LS_KEY + ':' + uid : GUEST_KEY;
  try { uid ? localStorage.setItem(LAST_UID_KEY, uid) : localStorage.removeItem(LAST_UID_KEY); } catch (e) {}
  data = emptyData();
  loadLocal();
  if (uid) {
    let guest = null;
    try { guest = JSON.parse(localStorage.getItem(GUEST_KEY) || 'null'); } catch (e) {}
    const gNotes = guest ? Object.values(guest.notes || {}).filter(n => !n.deleted) : [];
    if (gNotes.length && confirm(`로그인 전에 이 기기에서 쓴 메모 ${gNotes.length}개가 있습니다.\n지금 로그인한 계정으로 옮길까요?\n(취소하면 옮기지 않고 그대로 둡니다)`)) {
      Object.assign(data.folders, guest.folders || {});
      Object.assign(data.notes, guest.notes || {});
      if (guest.meta && guest.meta.vault && !data.meta.vault) data.meta.vault = guest.meta.vault;
      saveLocal();
      localStorage.removeItem(GUEST_KEY);
    }
  }
  ui.noteId = null; ui.view = 'all';
  document.body.classList.remove('editing');
  renderAll();
}

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function initCloud() {
  if (!FIREBASE_CONFIG) return;
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  try {
    await loadScript(base + 'firebase-app-compat.js');
    await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]);
  } catch (e) { setSync('err', '오프라인 — 이 기기에 저장 중'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  cloud.fs = firebase.firestore();
  try { await cloud.fs.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  firebase.auth().onAuthStateChanged(u => {
    cloud.user = u;
    $('loginBtn').classList.toggle('hidden', !!u);
    $('logoutBtn').classList.toggle('hidden', !u);
    if (u) { $('loginDlg').open && $('loginDlg').close(); switchUser(u.uid); cloud.start(); }
    else { switchUser(null); setSync('', '로그인하면 기기 간 동기화'); $('pw').value = ''; $('loginDlg').showModal(); }
  });
}
$('loginBtn').onclick = () => $('loginDlg').showModal();
$('loginLater').onclick = () => $('loginDlg').close();
$('logoutBtn').onclick = async () => {
  if (!confirm('로그아웃할까요? 다시 로그인하면 메모가 그대로 보입니다.')) return;
  await vault.flush();
  firebase.auth().signOut();
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginGo').click(); });
$('resetPw').onclick = async () => {
  const box = $('loginErr'), email = $('email').value.trim();
  box.classList.remove('ok');
  if (!email) { box.textContent = '위 칸에 이메일을 먼저 입력하세요'; $('email').focus(); return; }
  try {
    firebase.auth().languageCode = 'ko';
    await firebase.auth().sendPasswordResetEmail(email);
    box.classList.add('ok');
    box.textContent = '등록된 이메일이면 재설정 링크가 발송됩니다. 메일함(스팸함 포함)을 확인하세요.';
  } catch (e) {
    box.textContent = e.code === 'auth/invalid-email' ? '이메일 형식을 확인하세요'
      : e.code === 'auth/network-request-failed' ? '인터넷 연결을 확인하세요'
      : e.code === 'auth/too-many-requests' ? '요청이 너무 많습니다. 잠시 후 다시 해 보세요' : e.message;
  }
};
$('loginGo').onclick = async () => {
  $('loginErr').textContent = ''; $('loginErr').classList.remove('ok');
  try { await firebase.auth().signInWithEmailAndPassword($('email').value.trim(), $('pw').value); }
  catch (e) {
    const m = { 'auth/invalid-email': '이메일 형식을 확인하세요', 'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않습니다',
      'auth/wrong-password': '비밀번호가 맞지 않습니다', 'auth/user-not-found': '등록되지 않은 계정입니다',
      'auth/too-many-requests': '시도가 너무 많습니다. 잠시 후 다시 해 보세요', 'auth/network-request-failed': '인터넷 연결을 확인하세요' };
    $('loginErr').textContent = m[e.code] || e.message;
  }
};

/* ---------- 시작 ---------- */
loadLocal();
purgeOldTrash();
renderAll();
initCloud();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
